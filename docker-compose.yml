services:
  postgres:
    image: postgres:16-alpine
    container_name: lead-triage-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: leadtriage
      POSTGRES_PASSWORD: leadtriage
      POSTGRES_DB: leadtriage
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U leadtriage -d leadtriage"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
